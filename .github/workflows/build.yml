name: Build JIJIEFPVH743 ArduCopter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout custom board repository
        uses: actions/checkout@v4

      - name: Show custom repository layout
        run: |
          set -eux
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          git rev-parse HEAD
          test -f "$GITHUB_WORKSPACE/hwdef/hwdef.dat"
          test -f "$GITHUB_WORKSPACE/hwdef/hwdef-bl.dat"
          test -f "$GITHUB_WORKSPACE/hwdef/defaults.parm"
          ls -la "$GITHUB_WORKSPACE/hwdef"

      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          path: ardupilot
          submodules: recursive
          fetch-depth: 0

      - name: Install ArduPilot build dependencies and ARM GCC
        run: |
          set -eux
          cd ardupilot
          Tools/environment_install/install-prereqs-ubuntu.sh -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/opt/gcc-arm-none-eabi-10-2020-q4-major/bin" >> "$GITHUB_PATH"

      - name: Verify ARM compiler
        run: |
          set -eux
          command -v arm-none-eabi-gcc
          arm-none-eabi-gcc --version
          command -v arm-none-eabi-g++
          arm-none-eabi-g++ --version

      - name: Install custom JIJIEFPVH743 hwdef
        run: |
          set -eux
          SRC="$GITHUB_WORKSPACE/hwdef"
          DST="$GITHUB_WORKSPACE/ardupilot/libraries/AP_HAL_ChibiOS/hwdef/JIJIEFPVH743"
          test -f "$SRC/hwdef.dat"
          test -f "$SRC/hwdef-bl.dat"
          test -f "$SRC/defaults.parm"
          mkdir -p "$DST"
          cp "$SRC/hwdef.dat" "$DST/hwdef.dat"
          cp "$SRC/hwdef-bl.dat" "$DST/hwdef-bl.dat"
          cp "$SRC/defaults.parm" "$DST/defaults.parm"
          echo "Installed custom hwdef:"
          ls -la "$DST"

      - name: Verify board ID and IMU support
        run: |
          set -eux
          grep -n "AP_HW_DAKEFPVH743" ardupilot/Tools/AP_Bootloader/board_types.txt
          test "$(grep -c '^AP_HW_DAKEFPVH743 ' ardupilot/Tools/AP_Bootloader/board_types.txt)" -eq 1
          grep -R "LSM6DSK320X" ardupilot/libraries/AP_InertialSensor | head -20
          test -n "$(grep -R "DEVTYPE_INS_LSM6DSK320X" ardupilot/libraries/AP_InertialSensor | head -1)"

      - name: Configure board
        run: |
          set -eux
          cd ardupilot
          ./waf configure --board JIJIEFPVH743

      - name: Build bootloader
        run: |
          set -eux
          cd ardupilot
          ./waf configure --board JIJIEFPVH743 --bootloader
          ./waf bootloader

      - name: Build ArduCopter
        run: |
          set -eux
          cd ardupilot
          ./waf configure --board JIJIEFPVH743
          ./waf copter

      - name: Show build artifacts
        run: |
          set -eux
          find ardupilot/build/JIJIEFPVH743/bin -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: JIJIEFPVH743-ArduCopter
          path: |
            ardupilot/build/JIJIEFPVH743/bin/arducopter.apj
            ardupilot/build/JIJIEFPVH743/bin/arducopter_with_bl.hex
            ardupilot/build/JIJIEFPVH743/bin/AP_Bootloader.bin
